# instances/Laptop/engines/vulkan.yaml
# Vulkan – llama.cpp Vulkan-Build für Laptop (Thinkpad RTX 500 / iGPU)
bin_dir: "c:\\llama.cpp\\server\\server_06_vulcan"

# Engine-spezifische Laufzeit-Parameter (werden per deep-merge in Profil-common:+serve: eingebettet).
# Profil-Werte überschreiben diese Defaults.

common:
  n-gpu-layers: 99     # 99 = "alle Layer auf GPU" (llama.cpp clippt auf tatsächliche Anzahl)
  split-mode: none     # Vulkan unterstützt kein Multi-GPU-Splitting
  main-gpu: 0          # GPU-Index 0 (einzige GPU im Laptop)
  flash-attn: on       # Flash Attention für Vulkan aktiv

serve:
  no-kv-offload: true  # Vulkan kann KV-Cache nicht auf CPU auslagern
  cache-ram: 0         # Verhindert Vulkan-spezifische Abstürze bei RAM-Cache
